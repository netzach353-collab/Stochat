<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#7c3aed" />
<title>סטוצ'אט — צ'אט אנונימי</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--violet:#7c3aed;--fuchsia:#c026d3;--bg:#f8fafc;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--mutedbg:#f1f5f9}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Rubik',Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
input:focus,textarea:focus{outline:none}
#app{min-height:100%}
svg{display:block}
.app{min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:16px}
.muted{color:var(--muted)}
.err{color:#ef4444;font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px;line-height:1.7}

.header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}
.header-inner{max-width:720px;margin:0 auto;height:56px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;flex-shrink:0}
.brand-logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--violet),var(--fuchsia));display:grid;place-items:center;color:#fff;box-shadow:0 2px 6px rgba(124,58,237,.3)}
.brand-name{display:none}
@media(min-width:480px){.brand-name{display:inline}}
.nav{display:flex;gap:4px;background:var(--mutedbg);border-radius:999px;padding:4px}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;transition:.15s}
.nav-btn.active{background:#fff;color:var(--violet);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.user{display:flex;align-items:center;gap:6px;flex-shrink:0}
.user-name{display:none;font-size:13px;color:#475569}
@media(min-width:520px){.user-name{display:inline}}
.user-avatar{width:28px;height:28px;border-radius:999px;background:#ede9fe;color:#6d28d9;display:none;place-items:center;font-size:12px;font-weight:700}
@media(min-width:520px){.user-avatar{display:grid}}
.icon-btn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:#94a3b8;transition:.15s}
.icon-btn:hover{background:var(--mutedbg);color:var(--text)}
.logout:hover{background:#fef2f2;color:#ef4444}

.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.page-head h2{font-size:20px;font-weight:800}
.page-head p{font-size:13.5px;margin-top:2px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:14px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--fuchsia));color:#fff;font-weight:700;box-shadow:0 8px 20px rgba(124,58,237,.3);transition:.15s;width:100%}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(124,58,237,.38)}
.btn-primary:disabled{opacity:.5;transform:none;box-shadow:none}
.btn-primary.sm{width:auto;padding:9px 16px;font-size:13.5px;border-radius:999px;box-shadow:0 4px 12px rgba(124,58,237,.28)}
.btn-ghost{padding:14px 18px;border-radius:12px;background:var(--mutedbg);color:#475569;font-weight:600}

.room-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.room-card{display:flex;gap:12px;align-items:center;text-align:right;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;transition:.15s;width:100%}
.room-card:hover{border-color:#ddd6fe;box-shadow:0 6px 18px rgba(124,58,237,.1);transform:translateY(-1px)}
.room-ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#ede9fe,#fae8ff);color:#7c3aed;font-weight:800;font-size:18px;display:grid;place-items:center;flex-shrink:0}
.room-info{flex:1;min-width:0}
.room-title{font-weight:700;font-size:15.5px}
.room-desc{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-meta{color:#94a3b8;font-size:12px;margin-top:2px}

.chat-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:#fff}
.chat-head-info{min-width:0}
.chat-head-title{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-head-sub{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.composer input{flex:1;padding:10px 16px;border:1px solid var(--border);border-radius:999px;background:#fff;min-width:0}
.composer input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.send-btn{width:40px;height:40px;border-radius:999px;background:linear-gradient(135deg,var(--violet),var(--fuchsia));color:#fff;display:grid;place-items:center;flex-shrink:0;transition:.15s}
.send-btn:hover{transform:scale(1.06)}
.send-btn:disabled{opacity:.4;transform:none}

.msg{display:flex;gap:10px;align-items:flex-start}
.msg.mine{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:999px;background:#ede9fe;color:#6d28d9;font-weight:700;font-size:13px;display:grid;place-items:center;flex-shrink:0;transition:.15s}
button.avatar:hover{background:#ddd6fe}
.msg-body{background:#fff;border:1px solid var(--border);border-radius:14px 4px 14px 14px;padding:8px 12px;max-width:82%}
.msg.mine .msg-body{border-radius:4px 14px 14px 14px;background:#f5f3ff;border-color:#ddd6fe}
.msg-head{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.msg-name{font-size:12.5px;font-weight:700;color:#334155}
.msg-age{font-size:11px;color:var(--violet);background:#ede9fe;border-radius:999px;padding:0 6px}
.msg-time{font-size:11px;color:#94a3b8;margin-inline-start:auto}
.msg-text{font-size:14.5px;word-break:break-word;white-space:pre-wrap}

.chat-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.chat-item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;width:100%;text-align:right;transition:.15s}
.chat-item:hover{border-color:#ddd6fe;box-shadow:0 6px 18px rgba(124,58,237,.1);transform:translateY(-1px)}
.chat-item .avatar{width:44px;height:44px;font-size:16px}
.chat-item-main{flex:1;min-width:0}
.chat-item-name{font-weight:700;font-size:15.5px}
.chat-item-last{color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item-time{color:#94a3b8;font-size:11.5px;align-self:flex-start}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#7c3aed,#9333ea,#c026d3);position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px)}
.blob.b1{width:340px;height:340px;background:rgba(255,255,255,.16);top:-90px;right:-90px}
.blob.b2{width:340px;height:340px;background:rgba(240,171,252,.35);bottom:-90px;left:-90px}
.login-card{position:relative;width:100%;max-width:420px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-radius:24px;padding:32px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.login-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,var(--violet),var(--fuchsia));display:grid;place-items:center;color:#fff;box-shadow:0 10px 24px rgba(124,58,237,.4)}
.login-card h1{text-align:center;font-size:28px;font-weight:800}
.login-sub{text-align:center;color:var(--muted);margin:4px 0 24px;font-size:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:8px}
.field input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:#fff;transition:.15s}
.field input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.login-foot{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;color:#94a3b8;font-size:13px}

.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-card h3{font-size:18px;font-weight:800;margin-bottom:16px}
.modal-card textarea{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;resize:none;transition:.15s}
.modal-card textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions .btn-primary{flex:1}

/* באנר פרופיל שנפתח בלחיצה על הודעה */
.profile-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(15, 23, 42, .42);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
}

.profile-banner {
  width: 100%;
  max-width: 440px;
  background: #fff;
  border: 1px solid #e9d5ff;
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 20px 60px rgba(15, 23, 42, .2);
  animation: profileSlide .2s ease-out;
}

@keyframes profileSlide {
  from { transform: translateY(25px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.profile-banner-top {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-bottom: 16px;
}

.profile-banner-avatar {
  width: 58px;
  height: 58px;
  border-radius: 18px;
  background: linear-gradient(135deg, #ede9fe, #fae8ff);
  color: #7c3aed;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 800;
  flex-shrink: 0;
}

.profile-banner-name {
  font-size: 19px;
  font-weight: 800;
}

.profile-banner-age {
  color: #64748b;
  font-size: 13px;
}

.profile-banner-actions {
  display: flex;
  gap: 9px;
}

.profile-banner-actions button {
  flex: 1;
}

.profile-close {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border-radius: 12px;
  color: #64748b;
  background: #f1f5f9;
}

.msg-body {
  cursor: pointer;
}

.msg-body:hover {
  border-color: #c4b5fd;
}

@media (min-width: 600px) {
  .profile-overlay {
    align-items: center;
  }
}
  
  
/* אזור הצ'אט */
.app:has(.chat) {
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.chat-head {
  flex: 0 0 auto;
}

.chat {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;

  height: auto;
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  overflow: hidden;
}

/* אזור ההודעות */
.messages {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* תיבת ההקלדה והכפתור */
.composer {
  flex: 0 0 auto;
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: #fff;
  border-top: 1px solid var(--border);
}

/* שדה ההקלדה */
.composer input {
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  position: static;
  bottom: auto;
}

/* כפתור השליחה */
.composer button {
  flex: 0 0 40px;
  width: 40px;
  margin: 0;
  position: static;
  bottom: auto;
}

function setupAdminTrigger() {
  var timer = null;
  var triggered = false;

  document.addEventListener('pointerdown', function (event) {
    if (!event.target.closest('#adminTrigger')) return;

    triggered = false;
    clearTimeout(timer);

    timer = setTimeout(function () {
      triggered = true;
      adminGoogleLogin();
    }, 5000);
  });

  function stopPress() {
    clearTimeout(timer);
  }

  document.addEventListener('pointerup', stopPress);
  document.addEventListener('pointercancel', stopPress);
  document.addEventListener('pointerleave', stopPress);

  document.addEventListener('click', function (event) {
    if (!event.target.closest('#adminTrigger')) return;

    if (triggered) {
      event.preventDefault();
      event.stopPropagation();
      triggered = false;
    }
  }, true);
}

setupAdminTrigger();

  function read(key, fallback) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function write(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  function fmtTime(ts) {

    if (d.toDateString() === now.toDateString()) return fmtTime(ts);

  function getSession() { return read(KEYS.session, null); }

var unreadPrivateCount = 0;
var privateNotificationsChannel = null;

function updatePrivateBadge() {
  document.querySelectorAll('[data-nav="private"]').forEach(function (button) {
    var badge = button.querySelector('#privateUnreadBadge');

    if (unreadPrivateCount > 0) {
      if (!badge) {
        badge = document.createElement('span');
        badge.id = 'privateUnreadBadge';
        badge.className = 'private-unread-badge';
        button.appendChild(badge);
      }

      badge.textContent = unreadPrivateCount > 99
        ? '99+'
        : String(unreadPrivateCount);

      badge.style.display = 'inline-flex';
    } else if (badge) {
      badge.remove();
    }
  });
}


async function refreshUnreadBadge() {
  var me = getSession();
  if (!me || !me.id) return;

  try {
    var chats = await loadPrivateChatsFromSupabase();

    if (!chats.length) {
      unreadPrivateCount = 0;
      updatePrivateBadge();
      return;
    }

    var chatIds = chats.map(function (chat) {
      return chat.id;
    });

    var result = await supabaseClient
      .from('private_messages')
      .select('chat_id, sender_id, created_at')
      .in('chat_id', chatIds);

    if (result.error) throw result.error;

    var readTimes = getPrivateReadTimes();
    var count = 0;

    (result.data || []).forEach(function (message) {
      if (String(message.sender_id) === String(me.id)) return;

      var readAt = Number(readTimes[message.chat_id]) || 0;
      var messageTime = new Date(message.created_at).getTime();

      if (messageTime > readAt) count++;
    });

    unreadPrivateCount = count;
    updatePrivateBadge();

  } catch (error) {
    console.error('שגיאה בחישוב הודעות שלא נקראו:', error);
  }
}

async function markPrivateChatAsRead(chatId) {
  if (!chatId) return;

  var readTimes = getPrivateReadTimes();
  readTimes[chatId] = Date.now();

  write(PRIVATE_READ_KEY, readTimes);

  await refreshUnreadBadge();
}

async function handleIncomingPrivateMessage(row) {
  var me = getSession();

  if (!me || !row || !row.id) return;
  if (String(row.sender_id) === String(me.id)) return;

  try {
    var result = await supabaseClient
      .from('private_chats')
      .select('*')
      .eq('id', row.chat_id)
      .maybeSingle();

    if (result.error || !result.data) return;

    var chatRow = result.data;

    if (
      String(chatRow.user_a) !== String(me.id) &&
      String(chatRow.user_b) !== String(me.id)
    ) return;

    var chat = {
      id: chatRow.id,
      participants_key: participantsKey(chatRow.user_a, chatRow.user_b),
      participant_a_guest_id: chatRow.user_a,
      participant_b_guest_id: chatRow.user_b,
      participant_a_name: chatRow.user_a_name || 'אורח',
      participant_b_name: chatRow.user_b_name || 'אורח',
      participant_a_age: chatRow.user_a_age || '',
      participant_b_age: chatRow.user_b_age || '',
      last_message: row.content || '',
      last_message_at: new Date(row.created_at).getTime(),
      created_date: new Date(chatRow.created_at).getTime()
    };

    var cachedChats = read(KEYS.chats, []);
    var index = cachedChats.findIndex(function (item) {
      return item.id === chat.id;
    });

    if (index >= 0) {
      cachedChats[index] = Object.assign({}, cachedChats[index], chat);
    } else {
      cachedChats.push(chat);
    }

    write(KEYS.chats, cachedChats);

    var currentlyReading =
      view.name === 'chat' &&
      String(view.id) === String(chat.id);

    if (currentlyReading) {
      await markPrivateChatAsRead(chat.id);
      return;
    }

    addPrivateNotificationStyles();

    showPrivateToast({
      author_name: row.sender_name || 'משתמש',
      content: row.content || ''
    }, chat);

    await refreshUnreadBadge();

  } catch (error) {
    console.error('שגיאה בטיפול בהודעה פרטית חדשה:', error);
  }
}

function startPrivateNotifications() {
  var me = getSession();

  if (!me || !me.id) return;

  addPrivateNotificationStyles();

  if (
    privateNotificationsChannel &&
    privateNotificationsChannel.userId === String(me.id)
  ) {
    return;
  }

  if (privateNotificationsChannel) {
    supabaseClient.removeChannel(privateNotificationsChannel);
    privateNotificationsChannel = null;
  }

  var channel = supabaseClient
    .channel('private-notifications-' + me.id)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'private_messages'
      },
      function (payload) {
        handleIncomingPrivateMessage(payload.new);
      }
    )
    .subscribe(function (status) {
      if (status === 'SUBSCRIBED') {
        channel.userId = String(me.id);
      }

      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        console.error('שגיאה בהאזנה להתראות פרטיות:', status);
      }
    });

  privateNotificationsChannel = channel;

  refreshUnreadBadge();
}

async function findOrCreateChat(other) {
  var me = getSession();

  if (
  !me || !me.id ||
  !other || !other.id ||
  String(other.id) === String(me.id)
) {
  return null;
}

  try {
    // קודם בודקים אם השיחה כבר קיימת בסדר הראשון
    var result = await supabaseClient
      .from('private_chats')
      .select('*')
      .eq('user_a', me.id)
      .eq('user_b', other.id)
      .limit(1);

    if (result.error) throw result.error;

    var row = result.data && result.data[0];

    // אם לא נמצאה, בודקים בסדר ההפוך
    if (!row) {
      result = await supabaseClient
        .from('private_chats')
        .select('*')
        .eq('user_a', other.id)
        .eq('user_b', me.id)
        .limit(1);

      if (result.error) throw result.error;

      row = result.data && result.data[0];
    }

    // אם אין שיחה קיימת, יוצרים אחת בשרת
    if (!row) {
      var participants = [
        {
          id: me.id,
          name: me.name || 'אורח',
          age: Number(me.age) || null
        },
        {
          id: other.id,
          name: other.name || 'אורח',
          age: Number(other.age) || null
        }
      ].sort(function (a, b) {
        return a.id.localeCompare(b.id);
      });

      var now = new Date().toISOString();

      var insertResult = await supabaseClient
        .from('private_chats')
        .insert({
          id: crypto.randomUUID(),
          user_a: participants[0].id,
          user_b: participants[1].id,
          user_a_name: participants[0].name,
          user_b_name: participants[1].name,
          user_a_age: participants[0].age,
          user_b_age: participants[1].age,
          created_at: now,
          last_message_at: now
        })
        .select()
        .single();

      if (insertResult.error) throw insertResult.error;

      row = insertResult.data;
    }

    // ממירים את רשומת Supabase למבנה שהממשק הקיים מצפה לו
    var chat = {
      id: row.id,
      participants_key: participantsKey(row.user_a, row.user_b),
      participant_a_guest_id: row.user_a,
      participant_b_guest_id: row.user_b,
      participant_a_name: row.user_a_name || 'אורח',
      participant_b_name: row.user_b_name || 'אורח',
      participant_a_age: row.user_a_age || '',
      participant_b_age: row.user_b_age || '',
      last_message: '',
      last_message_at: row.last_message_at
        ? new Date(row.last_message_at).getTime()
        : Date.now(),
      created_date: row.created_at
        ? new Date(row.created_at).getTime()
        : Date.now()
    };

    // מעדכנים את המטמון המקומי בלי למחוק שיחות אחרות
    var chats = read(KEYS.chats, []);
    var index = chats.findIndex(function (c) {
      return c.id === chat.id;
    });

    if (index >= 0) {
      chat.last_message = chats[index].last_message || '';
      chats[index] = chat;
    } else {
      chats.push(chat);
    }

    write(KEYS.chats, chats);

    return chat;

  } catch (err) {
    console.error('שגיאה בפתיחת שיחה פרטית:', err);
    alert('לא הצלחנו לפתוח שיחה פרטית: ' + (err.message || 'שגיאה לא ידועה'));
    return null;
  }
}

      last_message_at: row.last_message_at
        ? new Date(row.last_message_at).getTime()
        : Date.now(),
      created_date: row.created_at
        ? new Date(row.created_at).getTime()
        : Date.now()
    };

    // טעינת ההודעה האחרונה של השיחה
    var lastResult = await supabaseClient
      .from('private_messages')
      .select('content, created_at')
      .eq('chat_id', row.id)
      .order('created_at', { ascending: false })
      .limit(1);

    if (lastResult.error) {
      console.error('שגיאה בטעינת הודעה אחרונה:', lastResult.error);
    } else if (lastResult.data && lastResult.data.length) {
      chat.last_message = lastResult.data[0].content || '';
      chat.last_message_at = new Date(
        lastResult.data[0].created_at
      ).getTime();
    }

    chats.push(chat);
  }

  // שומרים רק את השיחות שהתקבלו מהשרת עבור המשתמש הנוכחי,
  // יחד עם מטמון ישן של שיחות אחרות, אם קיים.
  var oldChats = read(KEYS.chats, []).filter(function (old) {
    return old.participant_a_guest_id !== me.id &&
           old.participant_b_guest_id !== me.id;
  });

  write(KEYS.chats, oldChats.concat(chats));

  return chats;
}
  
  
async function loadPrivateMessagesFromSupabase(chatId) {
  var result = await supabaseClient
    .from('private_messages')
    .select('*')
    .eq('chat_id', chatId)
    .order('created_at', { ascending: true });

  if (result.error) {
    console.error('שגיאה בטעינת הודעות פרטיות:', result.error);
    return null;
  }

  var serverMessages = (result.data || []).map(function (row) {
    return {
      id: row.id,
      chat_id: row.chat_id,
      author_guest_id: row.sender_id,
      author_name: row.sender_name,
      content: row.content,
      created_date: new Date(row.created_at).getTime()
    };
  });

  var allMessages = read(KEYS.privateMsgs, []).filter(function (m) {
    return m.chat_id !== chatId;
  });

  write(KEYS.privateMsgs, allMessages.concat(serverMessages));

  return serverMessages;
}


var privateMessagesChannel = null;
var subscribedPrivateChatId = null;

function listenToPrivateMessages(chatId) {
  // אם כבר קיים מנוי לאותה שיחה, לא יוצרים מנוי נוסף
  if (
    privateMessagesChannel &&
    subscribedPrivateChatId === chatId
  ) {
    return;
  }

  // מסירים מנוי קודם, אם עברנו לשיחה אחרת
  if (privateMessagesChannel) {
    supabaseClient.removeChannel(privateMessagesChannel);
  }

  subscribedPrivateChatId = chatId;

  privateMessagesChannel = supabaseClient
    .channel('private-messages-' + chatId)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',
        table: 'private_messages',
        filter: 'chat_id=eq.' + chatId
      },
      function (payload) {
        // מעבדים רק את ההודעה החדשה שהגיעה
        var row = payload.new;
        if (!row || !row.id) return;

        var message = {
          id: row.id,
          chat_id: row.chat_id,
          author_guest_id: row.sender_id,
          author_name: row.sender_name || 'אורח',
          content: row.content || '',
          created_date: new Date(row.created_at).getTime()
        };

        // מניעת הוספה כפולה לאחסון המקומי
        var allMessages = read(KEYS.privateMsgs, []);
        var alreadyExists = allMessages.some(function (m) {
          return m.id === message.id;
        });

        if (!alreadyExists) {
          allMessages.push(message);
          write(KEYS.privateMsgs, allMessages);
        }

        // מעדכנים את תצוגת הצ'אט בלי לטעון מחדש את כל המסך
        if (view.name === 'chat' && view.id === chatId) {
          var messagesEl = document.getElementById('messages');

          if (messagesEl) {
            var empty = messagesEl.querySelector('.empty');
            if (empty) empty.remove();

            var existsInDOM = messagesEl.querySelector(
              '[data-private-message-id="' + message.id + '"]'
            );

            if (!existsInDOM) {
              var wrapper = document.createElement('div');
              wrapper.innerHTML = privateMsgHtml(message);

              var messageEl = wrapper.firstElementChild;

              if (messageEl) {
                messageEl.setAttribute(
                  'data-private-message-id',
                  message.id
                );

                messagesEl.appendChild(messageEl);
                scrollMsgs();
              }
            }
          }
        }
      }
    )
    .subscribe(function (status, err) {
      console.log('מצב Realtime של צ׳אט פרטי:', status, err || '');

      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        console.error('שגיאה ב־Realtime של צ׳אט פרטי:', status, err);
      }
    });
}

var roomsRefreshOnReturnInstalled = false;

function installRoomsRefreshOnReturn() {
  if (roomsRefreshOnReturnInstalled) return;
  roomsRefreshOnReturnInstalled = true;

  var wasOffline = !navigator.onLine;
  var wasHidden = document.hidden;

  window.addEventListener('offline', function () {
    wasOffline = true;
  });

  window.addEventListener('online', async function () {
    if (!wasOffline) return;
    wasOffline = false;

    if (view && view.name === 'rooms') {
      await loadRoomsFromSupabase();
    }
  });

  document.addEventListener('visibilitychange', async function () {
    if (document.hidden) {
      wasHidden = true;
      return;
    }

    if (!wasHidden) return;
    wasHidden = false;

    if (navigator.onLine && view && view.name === 'rooms') {
      await loadRoomsFromSupabase();
    }
  });
}

var subscribedRoomId = null;

function listenToRoomMessages(roomId) {

    roomMessagesChannel &&
    subscribedRoomId === roomId
  ) {

    roomMessagesChannel = null;
    subscribedRoomId = null;

  var channel = supabaseClient
    .channel('room-messages-' + roomId)
    .on(
      'postgres_changes',
      {
        event: 'INSERT',
        schema: 'public',

      },

async function loadRoomMessagesFromSupabase(roomId) {
  var { data, error } = await supabaseClient
    .from('room_messages')
    .select('*')
    .eq('room_id', roomId)
    .order('created_at', { ascending: true });

  if (error) {
    console.error('שגיאה בטעינת הודעות מהשרת:', error);
    return;
  }

  var serverMessages = (data || []).map(function (row) {
    return {
      id: row.id,
      room_id: row.room_id,
      author_guest_id: row.sender_id,
      author_name: row.sender_name,
      author_age: row.sender_age || '',
      content: row.content,
      created_date: new Date(row.created_at).getTime()
    };
  });

  // שומרים את הודעות החדרים האחרים,

  var allMessages = read(KEYS.roomMsgs, []).filter(function (m) {

    return null;
  }

  var { data, error } = await supabaseClient
    .from('rooms')
    .insert({
      title: room.title,
      description: room.description || '',
      creator_name: me.name || 'אורח',
      creator_id: me.id,
      creator_age: Number(me.age) || null
    })
    .select()
    .single();

 if (error) {
  console.error('שגיאה ביצירת נושא:', error);

  alert(
    'שגיאה בשמירת הנושא:\n' +
    'קוד: ' + (error.code || 'אין') + '\n' +
    'הודעה: ' + (error.message || 'אין') + '\n' +
    'פרטים: ' + (error.details || 'אין') + '\n' +
    'רמז: ' + (error.hint || 'אין')
  );

  return null;
}

  return {
    ...data,
    created_date: new Date(data.created_at).getTime(),
    creator_name: data.creator_name || 'אורח',
    creator_age: data.creator_age || ''
  };
}

  /* ---------- Render dispatcher ---------- */
  function render() {
    var s = getSession();
    if (!s) { view = { name: 'login', id: null }; renderLogin(); return; }
    if (view.name === 'login') view = { name: 'rooms', id: null };
    switch (view.name) {
      case 'room': renderRoomChat(view.id); break;
      case 'live': renderLiveUsers(); break;
      case 'private': renderPrivateList(); break;
      case 'chat': renderPrivateChat(view.id); break;
      default: renderRooms();
    }
  }
  
  let liveChannel = null;
let liveUsers = [];

function statusDotHtml(userId) {
  var online = liveUsers.some(function (user) {
    return String(user.id) === String(userId);
  });

  return '<span class="status-dot" data-status-user-id="' +
    esc(String(userId)) +
    '" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' +
    (online ? '#22c55e' : '#ef4444') +
    ';margin-inline-start:8px;vertical-align:middle;"></span>';
}

function updatePresenceIndicators() {
  document.querySelectorAll('[data-status-user-id]').forEach(function (dot) {
    var online = liveUsers.some(function (user) {
      return String(user.id) === dot.dataset.statusUserId;
    });

    dot.style.backgroundColor = online ? '#22c55e' : '#ef4444';
  });
}

function startPresence() {
  const me = getSession();

  if (!me || !me.id) return;

  startPrivateNotifications();
listenToRoomsRealtime();
  
  if (liveChannel) return;


  liveChannel = supabaseClient.channel('stochat-live-users', {
    config: {
      presence: {
        key: String(me.id)
      }
    }
  });

  liveChannel
    .on('presence', { event: 'sync' }, () => {
      const state = liveChannel.presenceState();

      liveUsers = Object.values(state)
        .flat()
        .filter(user => user && user.id)
        .filter((user, index, array) =>
          array.findIndex(item => item.id === user.id) === index
        );

      updateLiveUsersList();
      updatePresenceIndicators();
      
    })
    .subscribe(async status => {
      if (status === 'SUBSCRIBED') {
        await liveChannel.track({
          id: String(me.id),
          name: me.name || 'משתמש',
          age: me.age || null
        });
      }
    });
}



function renderLiveUsers() {
  app.innerHTML =
    '<div class="app">' +
      header('live') +
      '<main class="main">' +

        '<div style="display:flex; justify-content:flex-start; margin-bottom:16px;">' +
          '<button type="button" id="backFromLive" class="btn btn-secondary">' +
            '→ חדרים' +
          '</button>' +
        '</div>' +

        '<div class="page-head">' +
          '<div>' +
            '<h2>משתמשים בלייב</h2>' +
            '<p>האנשים שמחוברים כרגע</p>' +
          '</div>' +
          '<span id="liveCount">0 מחוברים</span>' +
        '</div>' +

        '<div id="liveUsersList" class="room-list">' +
          '<div class="empty">טוען משתמשים מחוברים...</div>' +
        '</div>' +

      '</main>' +
    '</div>';

  document.getElementById('backFromLive').onclick = function () {
    go('rooms');
  };

  updateLiveUsersList();
}



function updateLiveUsersList() {
  if (view.name !== 'live') return;

  const list = document.getElementById('liveUsersList');
  const count = document.getElementById('liveCount');

  if (!list || !count) return;

  const me = getSession();

  const otherUsers = liveUsers.filter(user =>
    !me || String(user.id) !== String(me.id)
  );

  count.textContent = otherUsers.length + ' מחוברים';

  if (!otherUsers.length) {
    list.innerHTML =
      '<div class="empty">כרגע אין משתמשים מחוברים.</div>';
    return;
  }

  list.innerHTML = otherUsers.map(user => {
    return (
      '<button class="chat-item" ' +
        'data-live-user-id="' + esc(String(user.id)) + '">' +
        '<span class="avatar">' +
          esc((user.name || '?').charAt(0)) +
        '</span>' +
        '<span class="chat-item-main">' +
          '<span class="chat-item-name">' +
            esc(user.name || 'משתמש') +
          '</span>' +
          '<span class="chat-item-last" style="display: block; margin-top: 4px;">מחובר/ת עכשיו</span>' +
        '</span>' +
        '<span class="live-dot"></span>' +
      '</button>'
    );
  }).join('');
}

  
  
  
  function go(name, id) { view = { name: name, id: id || null }; render(); }

  
/* ===== פעולות מסך המנהל ===== */

document.addEventListener('click', async function (event) {
  var target = event.target.closest(
    '#adminLogout, #adminBackToChats, [data-admin-open-chat]'
  );

  if (!target) return;

  if (target.id === 'adminLogout') {
    await supabaseClient.auth.signOut();
    clearSession();
    view = { name: 'login', id: null };
    renderLogin();
    return;
  }

  if (target.id === 'adminBackToChats') {
    renderAdminChats();
    return;
  }

  if (target.hasAttribute('data-admin-open-chat')) {
    renderAdminChatMessages(target.dataset.adminOpenChat);
  }
});

  
  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-nav],[data-open-room],[data-open-chat],[data-author-id],[data-live-user-id],[data-logout],[data-new-room],[data-close-modal]');
if (!t) return;

if (t.hasAttribute('data-live-user-id')) {
  var user = liveUsers.find(function (u) {
    return String(u.id) === t.dataset.liveUserId;
  });

  if (user) openProfileBanner(user);
  return;
}
    if (t.hasAttribute('data-close-modal')) { closeModal(); return; }
    if (t.hasAttribute('data-new-room')) { openRoomModal(); return; }
    if (t.hasAttribute('data-logout')) { clearSession(); go('login'); return; }
    if (t.dataset.nav) { go(t.dataset.nav); return; }
    
if (t.dataset.openRoom) {
  var roomId = t.dataset.openRoom;
  go('room', roomId);
  loadRoomMessagesFromSupabase(roomId);
  return;
}

    if (t.dataset.openChat) { go('chat', t.dataset.openChat); return; }
   
if (t.dataset.authorId) {
  openProfileBanner({
    id: t.dataset.authorId,
    name: t.dataset.authorName,
    age: Number(t.dataset.authorAge)
  });
  return;
}

  });

  
document.addEventListener('submit', async function (e) {
  var form = e.target;
  e.preventDefault();

  // ===== כניסה כאורח =====
  if (form.id === 'loginForm') {
    var name = document.getElementById('nameInput').value.trim();
    var age = parseInt(document.getElementById('ageInput').value, 10);
    var errEl = document.getElementById('loginErr');
    var loginBtn = form.querySelector('button[type="submit"]');

    if (!name) {
      errEl.textContent = 'אנא הזן שם';
      return;
    }

    if (!age || age < 13 || age > 120) {
      errEl.textContent = 'אנא הזן גיל תקין (13-120)';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'מתחבר...';
    errEl.textContent = '';

    try {
      var authResult = await supabaseClient.auth.getSession();

      if (authResult.error) throw authResult.error;

      var authSession = authResult.data.session;

      if (!authSession) {
        var signInResult =
          await supabaseClient.auth.signInAnonymously();

        if (signInResult.error) throw signInResult.error;

        authSession = signInResult.data.session;
      }

      if (!authSession || !authSession.user) {
        throw new Error('לא התקבלה זהות משתמש מ-Supabase');
      }

      setSession({
        id: authSession.user.id,
        name: name,
        age: age,
        joinedAt: Date.now()
      });
      
startPresence();
      
      await loadRoomsFromSupabase();
      go('rooms');

    } catch (err) {
      console.error('שגיאת כניסה:', err);
      errEl.textContent =
        'לא הצלחנו להתחבר: ' + (err.message || 'שגיאה לא ידועה');
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = 'כניסה כאורח';
    }

    return;
  }

  // ===== פתיחת חדר ציבורי =====
  if (form.id === 'roomForm') {
    var titleInput = document.getElementById('rTitle');
    var descInput = document.getElementById('rDesc');
    var roomErr = document.getElementById('rErr');
    var createBtn = form.querySelector('button[type="submit"]');

    var title = titleInput.value.trim();
    var description = descInput.value.trim();

    if (!title) {
      roomErr.textContent = 'צריך להזין כותרת לחדר';
      titleInput.focus();
      return;
    }

    createBtn.disabled = true;
    createBtn.textContent = 'פותח חדר...';
    roomErr.textContent = '';

    try {
      var createdRoom = await createRoomInSupabase({
        title: title,
        description: description
      });

      if (!createdRoom) {
        roomErr.textContent = 'יצירת החדר נכשלה. בדוק אם הופיעה הודעת שגיאה.';
        return;
      }

      var rooms = read(KEYS.rooms, []);

      rooms = rooms.filter(function (r) {
        return r.id !== createdRoom.id;
      });

      rooms.unshift(createdRoom);
      write(KEYS.rooms, rooms);

      closeModal();
      go('room', createdRoom.id);

      await loadRoomMessagesFromSupabase(createdRoom.id);

    } catch (err) {
      console.error('שגיאה בפתיחת חדר:', err);
      roomErr.textContent =
        'שגיאה ביצירת החדר: ' + (err.message || 'שגיאה לא ידועה');
    } finally {
      if (createBtn.isConnected) {
        createBtn.disabled = false;
        createBtn.textContent = 'פתח חדר';
      }
    }

    return;
  }

  // ===== שליחת הודעה בחדר ציבורי =====
  if (form.id === 'roomComposer') {
    var input = document.getElementById('roomInput');
    var messageText = input.value.trim();
    var me = getSession();
    var roomId = view.id;
    var sendBtn = form.querySelector('button[type="submit"]');

    if (!messageText) return;

    if (!me || !roomId) {
      alert('צריך להתחבר מחדש כדי לשלוח הודעות');
      return;
    }

    sendBtn.disabled = true;

    try {
      var result = await supabaseClient
        .from('room_messages')
        .insert({
          room_id: roomId,
          sender_id: me.id,
          sender_name: me.name,
          sender_age: Number(me.age) || null,
          content: messageText
        })
        .select()
        .single();

      if (result.error) throw result.error;

      input.value = '';

      await loadRoomMessagesFromSupabase(roomId);

    } catch (err) {
      console.error('שגיאה בשליחת הודעה:', err);
      alert(
        'ההודעה לא נשלחה:\n' +
        (err.message || 'שגיאה לא ידועה')
      );
    } finally {
      var currentBtn = document.querySelector(
        '#roomComposer button[type="submit"]'
      );

      if (currentBtn) currentBtn.disabled = false;
    }

    return;
  }

  // ===== שליחת הודעה בצ'אט פרטי מקומי =====
  
  // ===== שליחת הודעה בצ'אט פרטי דרך Supabase =====
  if (form.id === 'chatComposer') {
    var cInput = document.getElementById('chatInput');
    var cText = cInput.value.trim();
    var s2 = getSession();
    var chatId = view.id;
    var sendBtn = form.querySelector('button[type="submit"]');

    if (!cText) return;

    if (!s2 || !s2.id || !chatId) {
      alert('צריך להתחבר מחדש כדי לשלוח הודעות');
      return;
    }

    sendBtn.disabled = true;

    try {
      var now = new Date().toISOString();

      var result = await supabaseClient
        .from('private_messages')
        .insert({
          id: crypto.randomUUID(),
          chat_id: chatId,
          sender_id: s2.id,
          sender_name: s2.name || 'אורח',
          content: cText,
          created_at: now
        })
        .select()
        .single();

      if (result.error) throw result.error;

      // מעדכנים את זמן הפעילות של השיחה
      var updateResult = await supabaseClient
        .from('private_chats')
        .update({
          last_message_at: now
        })
        .eq('id', chatId);

      if (updateResult.error) {
        console.error('ההודעה נשלחה, אך עדכון זמן השיחה נכשל:', updateResult.error);
      }

      cInput.value = '';

      // מציגים מיד את ההודעה שנשמרה בשרת,
      // בלי לטעון מחדש את הצ'אט.
      var row = result.data;

      if (row) {
        var sentMessage = {
          id: row.id,
          chat_id: row.chat_id,
          author_guest_id: row.sender_id,
          author_name: row.sender_name || 'אורח',
          content: row.content || '',
          created_date: new Date(row.created_at).getTime()
        };

        var allMessages = read(KEYS.privateMsgs, []);
        var exists = allMessages.some(function (m) {
          return m.id === sentMessage.id;
        });

        if (!exists) {
          allMessages.push(sentMessage);
          write(KEYS.privateMsgs, allMessages);
        }

        if (view.name === 'chat' && view.id === chatId) {
          var messagesEl = document.getElementById('messages');

          if (messagesEl) {
            var empty = messagesEl.querySelector('.empty');
            if (empty) empty.remove();

            if (!messagesEl.querySelector(
              '[data-private-message-id="' + sentMessage.id + '"]'
            )) {
              var wrapper = document.createElement('div');
              wrapper.innerHTML = privateMsgHtml(sentMessage);

              var messageEl = wrapper.firstElementChild;

              if (messageEl) {
                messageEl.setAttribute(
                  'data-private-message-id',
                  sentMessage.id
                );

                messagesEl.appendChild(messageEl);
                scrollMsgs();
              }
            }
          }
        }
      }

    } catch (err) {
      console.error('שגיאה בשליחת הודעה פרטית:', err);

      alert(
        'ההודעה לא נשלחה:\n' +
        (err.message || 'שגיאה לא ידועה')
      );

    } finally {
      var currentBtn = document.querySelector(
        '#chatComposer button[type="submit"]'
      );

      if (currentBtn) currentBtn.disabled = false;
    }

    return;
  }
});


  window.addEventListener('storage', function (e) {
    if (e.key && e.key.indexOf('stochat_') === 0) render();
  });

/* ===== אתחול האתר וזיהוי מנהל Google ===== */

async function initializeApp() {
  try {
    var authResult = await supabaseClient.auth.getSession();

    if (authResult.error) {
      throw authResult.error;
    }

    var authSession = authResult.data.session;

    // בודקים את הרשאת המנהל מול פונקציית Supabase הקיימת
    if (authSession && authSession.user) {
      var adminResult = await supabaseClient.rpc('is_admin');

      if (adminResult.error) {
        console.error(
          'בדיקת הרשאת מנהל נכשלה:',
          adminResult.error
        );
      } else if (adminResult.data === true) {
        await renderAdminChats();
        return;
      }
    }

    // אם זה לא מנהל, ממשיכים במסלול הרגיל של האתר
    if (getSession()) {
      view = { name: 'rooms', id: null };
      startPresence();
      await loadRoomsFromSupabase();
    } else {
      render();
    }

  } catch (error) {
    console.error('שגיאה באתחול האתר:', error);

    // לא מוחקים סשן קיים בגלל שגיאת רשת זמנית
    if (getSession()) {
      view = { name: 'rooms', id: null };
      render();
    } else {
      render();
    }
  }
}

initializeApp();


})();
